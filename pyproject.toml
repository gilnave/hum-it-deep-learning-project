[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humming-song-retrieval"
version = "0.1.0"
description = "TAU Deep Learning course project for query-by-humming song retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "librosa>=0.10.2,<1",
  "soundfile>=0.12,<1",
  "imageio-ffmpeg>=0.5,<1",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "gradio>=5,<7",
  "huggingface-hub>=0.24,<1",
  "yt-dlp>=2026.7.4,<2027",
  "yt-dlp-ejs>=0.8,<1",
]

[project.optional-dependencies]
separation = [
  "demucs==4.0.1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

